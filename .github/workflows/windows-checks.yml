# Eva's checks on a clean Windows machine for every push and pull request (Phase 1: Windows CI).
# run_checks.py stubs the screen, microphone and network, so no key, display or audio is needed.
# Locally the same gate is tools\windows_checks.bat.
name: windows-checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run checks
        run: python run_checks.py
      - name: Soak (2,000 turns through the real pipeline)
        run: python tools/soak_test.py --turns 2000
