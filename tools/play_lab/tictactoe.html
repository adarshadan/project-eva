<!doctype html><meta charset="utf-8"><title>Tic-tac-toe</title>
<style>body{margin:0;background:#fafafa;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
#b{display:grid;grid-template-columns:repeat(3,130px);grid-template-rows:repeat(3,130px)}
.c{display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:bold;cursor:pointer;color:#333}
.c:nth-child(-n+6){border-bottom:6px solid #222}.c:not(:nth-child(3n)){border-right:6px solid #222}
#msg{position:fixed;top:20px;width:100%;text-align:center;font-size:24px}</style>
<div id=msg>You are X</div><div id=b></div>
<script>
// The person (Eva) is X; the computer plays O: wins if it can, blocks if it must, else random.
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let s=Array(9).fill(''),over=false;
const b=document.getElementById('b');for(let i=0;i<9;i++){const d=document.createElement('div');d.className='c';d.onclick=()=>play(i);b.appendChild(d)}
function win(p){return L.some(l=>l.every(i=>s[i]===p))}
function draw(){[...b.children].forEach((d,i)=>{d.textContent=s[i];d.style.color=s[i]=='O'?'#c0392b':'#2c3e50'})}
function end(t){over=true;document.getElementById('msg').textContent=t;window.RESULT=t}
function ai(){const e=s.map((v,i)=>v?null:i).filter(v=>v!==null);
 for(const p of ['O','X'])for(const i of e){s[i]=p;const w=win(p);s[i]='';if(w)return i}
 if(!s[4])return 4;return e[Math.floor(Math.random()*e.length)]}
function play(i){if(over||s[i])return;s[i]='X';draw();if(win('X'))return end('X wins');if(s.every(v=>v))return end('draw');
 setTimeout(()=>{s[ai()]='O';draw();if(win('O'))return end('O wins');if(s.every(v=>v))end('draw')},500)}
</script>
